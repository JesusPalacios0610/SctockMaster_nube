databases:
  - name: electromarket-db
    databaseName: electromarket
    user: electromarket
    plan: free
    postgresMajorVersion: "17"
    region: ohio
    ipAllowList: []

services:
  - type: web
    name: electromarket-api
    runtime: docker
    plan: free
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: electromarket-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: electromarket-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: electromarket-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: electromarket-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: electromarket-db
          property: password
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_MINUTES
        value: "480"
      - key: APP_ADMIN_USERNAME
        value: admin
      - key: APP_ADMIN_NAME
        value: Administrador
      - key: APP_ADMIN_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://electromarket-frontend-aafi.onrender.com

  - type: web
    name: electromarket-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://electromarket-api.onrender.com/api
