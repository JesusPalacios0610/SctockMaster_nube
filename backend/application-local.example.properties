spring.datasource.url=jdbc:postgresql://localhost:5432/electromarket
spring.datasource.username=postgres
spring.datasource.password=

# Define JWT_SECRET, APP_ADMIN_USERNAME, APP_ADMIN_NAME y APP_ADMIN_PASSWORD
# en las variables de entorno de la terminal antes de iniciar Spring Boot.
app.security.jwt-secret=${JWT_SECRET:}
app.bootstrap.admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin.name=${APP_ADMIN_NAME:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
