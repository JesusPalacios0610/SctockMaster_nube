spring.application.name=electromarket

# Valores seguros para desarrollo local; producción se configura mediante variables de entorno.
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:electromarket}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# La base de datos se administra con los scripts SQL; Hibernate solo valida el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.flyway.baseline-on-migrate=true

# Orígenes permitidos separados por coma. En la nube se configura el dominio del frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Llave HMAC en Base64 para firmar tokens JWT. Debe ser propia de cada entorno.
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:480}

# Solo se crea el usuario administrador inicial cuando la tabla usuario está vacía.
app.bootstrap.admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin.name=${APP_ADMIN_NAME:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}
